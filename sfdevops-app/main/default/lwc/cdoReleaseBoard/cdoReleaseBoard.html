<template>
    <lightning-card title="Release board" icon-name="standard:release">
        <div slot="actions" class="slds-grid slds-grid_vertical-align-end slds-gutters_x-small">
            <template lwc:if={showProjectPicker}>
                <div class="slds-col">
                    <lightning-combobox name="project" label="Project" variant="label-hidden" value={projectId}
                        options={projectOptions} onchange={handleProjectChange}></lightning-combobox>
                </div>
            </template>
            <div class="slds-col">
                <lightning-button label="New release" icon-name="utility:add" onclick={toggleNewForm}></lightning-button>
            </div>
            <div class="slds-col">
                <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh releases" title="Refresh releases"
                    onclick={handleRefresh}></lightning-button-icon>
            </div>
        </div>

        <div class="slds-card__body_inner">
            <template lwc:if={showNewForm}>
                <section class="slds-box slds-m-bottom_medium" aria-label="New release">
                    <div class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label="Release name" value={newName} onchange={handleNewNameChange} max-length="80" required></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                            <lightning-input type="date" label="Target date" value={newTargetDate} onchange={handleNewDateChange}></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-button variant="brand" label="Create" onclick={handleCreate} disabled={createDisabled}></lightning-button>
                        </div>
                    </div>
                </section>
            </template>

            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-p-around_large">
                    <lightning-spinner alternative-text="Loading releases" size="small"></lightning-spinner>
                </div>
            </template>
            <template lwc:elseif={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>Could not load releases: {error}</h2>
                </div>
            </template>
            <template lwc:elseif={noProjects}>
                <p class="slds-text-color_weak">No projects yet. Run seed-pipeline.py to load the pipeline.</p>
            </template>
            <template lwc:else>
                <template lwc:if={hasReleases}>
                    <div class="board slds-grid slds-nowrap" role="list" aria-label="Releases by status">
                        <template for:each={columns} for:item="col">
                            <section key={col.status} class="board__column" role="listitem" aria-labelledby={col.headingId}>
                                <h3 id={col.headingId} class="slds-text-title_caps slds-m-bottom_x-small">
                                    <span class={col.badgeClass}>{col.label}</span>
                                    <span class="slds-m-left_xx-small slds-text-color_weak">{col.count}</span>
                                </h3>
                                <template lwc:if={col.isEmpty}>
                                    <p class="slds-text-body_small slds-text-color_weak">None</p>
                                </template>
                                <template for:each={col.items} for:item="r">
                                    <button
                                        key={r.id}
                                        class={r.tileClass}
                                        data-id={r.id}
                                        aria-pressed={r.ariaPressed}
                                        onclick={handleSelectRelease}
                                    >
                                        <span class="slds-text-heading_small slds-truncate release-tile__name">{r.name}</span>
                                        <span class="slds-text-body_small slds-text-color_weak">{r.targetLabel}</span>
                                        <span class="slds-text-body_small">{r.countLabel}</span>
                                    </button>
                                </template>
                            </section>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak">No releases yet. Use New release to plan one.</p>
                </template>

                <template lwc:if={selected}>
                    <section class="slds-m-top_medium slds-box" aria-label="Selected release">
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-grid_align-spread">
                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                <h3 class="slds-text-heading_medium slds-m-right_small">
                                    <a href={selectedUrl} onclick={handleOpenRelease}>{selected.name}</a>
                                </h3>
                                <span class={selectedStatusClass}>{selectedStatusLabel}</span>
                            </div>
                            <div class="slds-m-top_x-small">
                                <lightning-button label="Assemble" icon-name="utility:merge" onclick={handleAssemble}
                                    disabled={assembleDisabled} class="slds-m-right_x-small"
                                    title="Cut the release branch from these work items"></lightning-button>
                                <template lwc:if={canRunProdRelease}>
                                    <lightning-button variant="brand" label="Release to Production" icon-name="utility:rocket"
                                        onclick={handleReleaseToProduction} disabled={releaseDisabled}></lightning-button>
                                </template>
                            </div>
                        </div>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{releaseHint}</p>

                        <dl class="slds-dl_horizontal slds-m-top_small">
                            <dt class="slds-dl_horizontal__label">Target date</dt>
                            <dd class="slds-dl_horizontal__detail">{selectedTargetLabel}</dd>
                            <dt class="slds-dl_horizontal__label">Release branch</dt>
                            <dd class="slds-dl_horizontal__detail">
                                <template lwc:if={selected.releaseBranch}>{selected.releaseBranch}</template>
                                <template lwc:else>Not assembled yet</template>
                            </dd>
                            <template lwc:if={selected.tag}>
                                <dt class="slds-dl_horizontal__label">Tag</dt>
                                <dd class="slds-dl_horizontal__detail">
                                    <template lwc:if={selected.releaseUrl}>
                                        <a href={selected.releaseUrl} target="_blank" rel="noopener noreferrer">{selected.tag}</a>
                                    </template>
                                    <template lwc:else>{selected.tag}</template>
                                </dd>
                            </template>
                            <template lwc:if={selectedReleasedLabel}>
                                <dt class="slds-dl_horizontal__label">Released</dt>
                                <dd class="slds-dl_horizontal__detail">{selectedReleasedLabel}</dd>
                            </template>
                            <template lwc:if={selected.runUrl}>
                                <dt class="slds-dl_horizontal__label">Latest run</dt>
                                <dd class="slds-dl_horizontal__detail">
                                    <a href={selected.runUrl} target="_blank" rel="noopener noreferrer">Open in GitHub</a>
                                </dd>
                            </template>
                        </dl>

                        <h4 class="slds-text-title_caps slds-m-top_medium slds-m-bottom_xx-small">Work items in this release</h4>
                        <template lwc:if={hasSelectedWorkItems}>
                            <lightning-datatable key-field="Id" data={selectedWorkItems} columns={workItemColumns}
                                hide-checkbox-column onrowaction={handleRowAction}
                                aria-label="Work items in this release"></lightning-datatable>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-body_small slds-text-color_weak">No work items yet.</p>
                        </template>

                        <template lwc:if={canAddWorkItems}>
                            <h4 class="slds-text-title_caps slds-m-top_medium slds-m-bottom_xx-small">Add work items</h4>
                            <template lwc:if={hasAvailable}>
                                <div class="available-table">
                                    <lightning-datatable key-field="Id" data={availableRows} columns={availableColumns}
                                        selected-rows={selectedToAdd} onrowselection={handleAvailableSelection}
                                        aria-label="Work items not in a release"></lightning-datatable>
                                </div>
                                <div class="slds-text-align_right slds-m-top_x-small">
                                    <lightning-button label={addLabel} icon-name="utility:add" onclick={handleAdd} disabled={addDisabled}></lightning-button>
                                </div>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-body_small slds-text-color_weak">Every open work item is already in a release.</p>
                            </template>
                        </template>
                    </section>
                </template>
            </template>
            <template lwc:if={working}>
                <lightning-spinner alternative-text="Working" size="small"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
